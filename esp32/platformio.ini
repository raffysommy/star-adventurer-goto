; Star Adventurer ESP32-S3 mount controller
; First flash:  pio run -e usb -t upload        (board in BOOT mode or USB console available)
; Afterwards:   pio run -e ota -t upload        (over Wi-Fi, OTG port stays on the mount)
; Logs:         nc starmount.local 23           (or http://starmount.local/log)

[platformio]
default_envs = usb
extra_configs = secrets*.ini

; Override in secrets.ini (git-ignored), e.g.
; [secrets]
; build_flags = -DWIFI_SSID=\"myssid\" -DWIFI_PASS=\"mypass\" -DOTA_PASS=\"x\"
; and, if OTA_PASS is set:
; [env:ota]
; upload_flags = --auth=x
[secrets]
build_flags =

[esp32base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
monitor_speed = 115200
build_flags =
    ; Serial = UART0: the native USB PHY is reserved for the OTG host (mount)
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    ${secrets.build_flags}

[env:usb]
extends = esp32base
upload_speed = 921600

[env:ota]
extends = esp32base
upload_protocol = espota
upload_port = starmount.local

; Host-side unit tests of the pure mount math in lib/core:  pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -DUNITY_INCLUDE_DOUBLE
